<figcaption><b>图 2 | 反传链路（含第二层决策审查）。</b>错误信号先过锚定级联，四环依次尝试把错锚到最低可锚位置（前三环纯脚本，第④环是入口处唯一动用 LLM 的地方）。第一层（绿区）为机械验证反传：从锚点逆拓扑逐节点执行 V(node | parents)——按声明口径拿父节点原料独立重算，干净则上行，脏则继续上验父辈，停在「自己脏 · 父辈净」的节点即错误引入点（produced_by 指向元凶脚本，descendants 一跳给出作废清单）；无契约的语义节点由第③档算子接手——agent 以 P(node | parents) 逐节点判读（读节点声明与父辈原料），输出洗清或嫌疑，但不停机不定罪；机械层未找到引入点时，嫌疑清单按逆拓扑序复核，首个被重放坐实的嫌疑即引入点。全部节点干净而结论仍错时才进入第二层（橙区）：图转岗为调度台，定位可疑产物的段与执行者（并发假设线必须切对人的转录）、掐时间窗、切出思考现场交 agent 找线索（低信任，定罪仍靠重放）；同类决策错误第二次出现即产物化为新契约+新验证器，沿青色虚线回流第一层——脚本地盘随轮次扩张（领土转移）。三条定罪路径汇入定罪报告，agent 据此起草最小编辑（倾向机械化），串行验收闸（一轮一处、冻结题库+holdout 回归）决定接受为 Sₜ₊₁ 或回滚记反对票；被拒编辑拼回下一轮反思提示。</figcaption>

<figcaption><b>图 3 | 重放 do 干预机制。</b>嫌疑（来自图 2 的 agent 逐节点判读或图警报灯）先进重放队列，按预期翻转概率与成本排序、跑到预算线为止。干预分设计与执行两权：模板内干预（补 seed、开关翻转）由脚本自动构造；模板外的语义嫌疑由 agent 设计干预方案（改哪一步、换成什么）——但执行永远是脚本：最小重放集 = 被疑节点的 consumes 闭包（马尔可夫性：给定父辈产物即与更早祖先条件独立，无需任何聊天上下文），单变量施加干预，考场标准评测器重跑（禁用 run 自己的 eval 脚本），沿 descendants 机械重算传播。三个出口：结论支撑翻转即坐实——且同一实验复用为编辑证据：坐实的干预方案就是实例级修复的因果凭据，agent 只需将其条款化为最小编辑（仍过串行验收，防实例有效但伤及其他案例）；不翻转即洗清——洗清不是终点而是诊断循环的一环，排除该因的证据回流给 agent 提出下一个嫌疑；设计不出干预或预算耗尽则不硬判，相关结论降级「未验证」进报告附栏，禁止据此起草编辑。副产品：按父辈闭包复现不出结果时，即暴露图上没画出的隐形输入，gap 报警并产物化补边——重放同时充当图完整性的测试。</figcaption>
